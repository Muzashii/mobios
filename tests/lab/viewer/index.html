<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Mobios lab viewer</title>
    <style>
      html, body { margin: 0; height: 100%; background: #111; color: #ddd; font: 12px monospace; }
      #grid { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; height: 100%; }
      .cell { position: relative; }
      .cell span { position: absolute; left: 6px; top: 4px; z-index: 2; }
      canvas { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="grid"></div>
    <script type="module" src="./viewer.ts"></script>
  </body>
</html>
